r"><button type="button" class="modal__close-button"><img src="c61ec1048ba18ed3e9f2.svg" alt="An image of an X icon"/></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" id="edit-profile-modal-form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-button" id="edit-modal-submit-button">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-button"><img src="c61ec1048ba18ed3e9f2.svg" alt="An image of an X icon"/></button><h2 class="modal__title">New post</h2><form class="modal__form" id="new-post-modal-form" novalidate><label for="card-image-input" class="modal__label">Image link <input id="card-image-input" type="url" class="modal__input" placeholder="Place a link to the picture" required/> <span id="card-image-input-error" class="modal__error"></span></label> <label for="card-image-caption" class="modal__label">Caption <input id="card-image-caption" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="30" required/> <span id="card-image-caption-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__preview-container"><button type="button" class="modal__close-button modal__close-button_type_preview"><img src="1c517008152856bd3203.svg" alt="An image of an X
